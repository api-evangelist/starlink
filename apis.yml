- aid: starlink:starlink-telemetry-stream-api
  name: Starlink Telemetry Stream API
  description: A low-latency JSON over HTTP streaming API for device telemetry, consumed by
    repeated small-batch POST requests with batchSize and maxLingerMs parameters. POST /public/v2/telemetry/stream
    returns compact column-indexed telemetry for every device on the account, and POST /public/v2/telemetry/query
    returns the most recent typed values per device. Active device alerts ride in the same
    response as enum values resolved against response metadata. These two operations are documented
    in the API reference but are not present in the downloadable V2 OpenAPI.
  humanURL: https://starlink.readme.io/docs/telemetry-api
  baseURL: https://starlink.com/api/public/v2
  tags:
  - Telemetry
  - Streaming
  - Alerts
  properties:
  - type: Documentation
