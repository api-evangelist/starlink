apis:
- aid: starlink:starlink-telemetry-stream-api
  name: Starlink Telemetry Stream API
  description: >-
    A low-latency JSON over HTTP streaming API for device telemetry, consumed by repeated small-batch
    POST requests with batchSize and maxLingerMs parameters. POST /public/v2/telemetry/stream returns
    compact column-indexed telemetry for every device on the account, and POST /public/v2/telemetry/query
    returns the most recent typed values per device. Active device alerts ride in the same response as
    enum values resolved against response metadata. These two operations are documented in the API reference
    but are not present in the downloadable V2 OpenAPI.
  humanURL: https://starlink.readme.io/docs/telemetry-api
  baseURL: https://starlink.com/api/public/v2
  tags:
  - Telemetry
  - Streaming
  - Alerts
  properties:
  - type: Documentation
    url: https://starlink.readme.io/docs/telemetry-api
  - type: APIReference
    url: https://starlink.readme.io/reference/post_public-v2-telemetry-stream
  - type: Documentation
    url: https://starlink.readme.io/docs/alerts
  - type: AsyncAPI
    url: asyncapi/starlink-telemetry-asyncapi.yml
  - type: AgentSkill
    url: skills/starlink-consume-telemetry-and-alerts.md
- aid: starlink:starlink-local-device-api
  name: Starlink Local Device API
  description: >-
    SpaceX's officially supported local gRPC API on Starlink hardware, defined in protobuf and published
    verbatim on GitHub as device.proto. The SpaceX.API.Device service exposes a single Handle RPC carrying
    a GetDiagnostics request, answered by WifiGetDiagnosticsResponse or DishGetDiagnosticsResponse. The
    WiFi router serves it on 192.168.1.1 port 9000 and the user terminal on 192.168.100.1 port 9200. There
    is no authentication because it is reachable only on the local network.
  humanURL: https://starlink.readme.io/docs/device-api
  baseURL: http://192.168.100.1:9200
  tags:
  - gRPC
  - Device
  - Diagnostics
  properties:
  - type: Documentation
    url: https://starlink.readme.io/docs/device-api
  - type: Proto
    url: proto/starlink-device.proto
  - type: Protobuf
    url: proto/starlink-device.proto
  - type: SourceCode
    url: https://github.com/SpaceExplorationTechnologies/enterprise-api
- aid: starlink:starlink-router-local-https-api
  name: Starlink Router Local HTTPS API
  description: >-
    An optional HTTPS server hosted on the Starlink WiFi router itself, enabled through a router config
    in the Starlink dashboard with an enterprise-managed TLS certificate, key, and CORS allowed-origins
    list. Endpoints live under /starlinkrouter/ on the operator-chosen domain and cover system performance
    diagnostics and WiFi client sandboxing. Requires router software 2024.12.17.mr44165 or later.
  humanURL: https://starlink.readme.io/docs/router-api
  tags:
  - Router
  - Diagnostics
  - Captive Portal
  properties:
  - type: Documentation
    url: https://starlink.readme.io/docs/router-api
  - type: Documentation
    url: https://starlink.readme.io/docs/diagnostics
  - type: Documentation
    url: https://starlink.readme.io/docs/client-sandboxing-1
- aid: starlink:starlink-space-traffic-coordination-api
  name: Starlink Space Traffic Coordination API
  description: >-
    The API behind space-safety.starlink.com, SpaceX's free conjunction screening and maneuver coordination
    platform for satellite operators. Version 0.1 of the reference documents five resource groups - cdm
    for Conjunction Data Messages, event for conjunction events, object for satellites, operator, and
    trajectory - with paths such as GET /v1/object. Client authentication is mTLS using a client certificate
    signed by SpaceX after email onboarding, access is limited to satellite operators, and the OpenAPI
    source file itself is not published for download.
  humanURL: https://docs.space-safety.starlink.com/docs/api/space-traffic-coordination-apis
  baseURL: https://space-safety.starlink.com/api/v1
  tags:
  - Space Safety
  - Conjunction Screening
  - Satellite Operations
