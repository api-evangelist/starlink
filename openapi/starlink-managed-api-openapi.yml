openapi: 3.2.0
info:
  title: Starlink Public Managed API
  description: 'Description

    API to manage Starlink accounts and devices. For interactive endpoints list see: https://starlink.readme.io/

    Authentication - OIDC


    To authenticate with this API using OIDC, Well Known URL and attach the result to your requests with the Authorize button below.'
  version: '2'
servers:
- url: /api
tags:
- name: Managed
paths:
  /public/v2/managed/customers:
    post:
      tags:
      - Managed
      summary: Create a managed customer account
      description: This endpoint is only callable with an authorized provider account.
      requestBody:
        description: CreateManagedCustomerRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagedCustomerRequest'
      responses:
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden from creating customer accounts
        '200':
          description: Successfully created customer account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateManagedCustomerResponseServiceResponse'
        '422':
          description: Failed to create customer account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
      operationId: postPublicV2ManagedCustomers
      x-operation-id-source: derived
components:
  schemas:
    CreateManagedCustomerRequest:
      required:
      - email
      - firstName
      - lastName
      - locale
      - phone
      type: object
      properties:
        firstName:
          minLength: 1
          type: string
          description: First name.
        lastName:
          minLength: 1
          type: string
          description: Last name.
        email:
          minLength: 1
          type: string
          description: Email address.
        phone:
          minLength: 1
          type: string
          description: Phone number.
        locale:
          minLength: 1
          type: string
          description: ISO 639-1 language code.
        businessName:
          type:
          - string
          - 'null'
          description: Business name only required for enterprise customers.
      additionalProperties: false
    CreateManagedCustomerResponseServiceResponse:
      type: object
      properties:
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ValidationResult'
          readOnly: true
        warnings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ValidationResult'
          readOnly: true
        information:
          type:
          - array
          - 'null'
          items:
            type: string
          readOnly: true
        isValid:
          type: boolean
          readOnly: true
        content:
          $ref: '#/components/schemas/CreateManagedCustomerResponse'
      additionalProperties: false
    CreateManagedCustomerResponse:
      type: object
      properties:
        accountNumber:
          type:
          - string
          - 'null'
        serviceAccountClientId:
          type:
          - string
          - 'null'
        serviceAccountSecret:
          type:
          - string
          - 'null'
      additionalProperties: false
    ValidationResult:
      type: object
      properties:
        memberNames:
          type:
          - array
          - 'null'
          items:
            type: string
          readOnly: true
        errorMessage:
          type:
          - string
          - 'null'
      additionalProperties: false
    ServiceResponse:
      type: object
      properties:
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ValidationResult'
          readOnly: true
        warnings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ValidationResult'
          readOnly: true
        information:
          type:
          - array
          - 'null'
          items:
            type: string
          readOnly: true
        isValid:
          type: boolean
          readOnly: true
      additionalProperties: false
