aid: starlink
url: https://raw.githubusercontent.com/api-evangelist/starlink/refs/heads/main/apis.yml
name: Starlink
kind: company
description: Starlink is the low-Earth-orbit satellite internet constellation operated by
  SpaceX from Hawthorne, California, delivering broadband and non-terrestrial connectivity
  to residential, business, maritime, aviation, and government customers in the United States
  and roughly a hundred other markets. In the telecom value chain Starlink is an access-network
  operator that sells connectivity directly to end customers and wholesales capacity to airlines,
  shipping lines, and mobile network operators, rather than a CPaaS aggregator or a GSMA-affiliated
  mobile network operator. Its API posture is unusually open for an access provider and unusually
  narrow in scope. The Starlink Public API V2 is fully documented in public at starlink.readme.io,
  its OpenAPI 3.0.4 description is downloadable anonymously from starlink.com with no login,
  and SpaceX publishes an official gRPC protobuf for the local device API on GitHub. But the
  API is operational rather than developer-product, covering account, service line, user terminal,
  router, billing, and telemetry management, and credentials are gated behind an enterprise
  or business Starlink account whose admin must mint a V2 service account. No CAMARA implementation,
  no GSMA Open Gateway participation, and no TM Forum Open API conformance was found anywhere
  in Starlink's published material.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Telecommunications
- United States
- Satellite
- Broadband
- Non-Terrestrial Networks
- Connectivity
- Device Management
- Telemetry
- Aviation
- Maritime
- Enterprise
