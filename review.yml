  protoHarvested: 1
  asyncapiCreated: false
  reason: |
    One real downloadable OpenAPI and one real published protobuf were captured
    verbatim with provenance. No AsyncAPI was authored because no webhook, SSE, or
    WebSocket surface exists - the telemetry "stream" is client-driven polling
    over plain REST and is already covered by the REST transport.
