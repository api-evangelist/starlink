- aid: starlink:starlink-mobile-data-api
  name: Starlink Mobile Data API
  description: A gated feature within the Starlink Public API V2 exposing Starlink Mobile
    radio access network data, usage and beam reliability timeseries, and map data, each partitioned
    by timestamp date and hour and retrievable one hour at a time. Requires the Gated Feature
    - Starlink Mobile Data, View permission on the calling service account.
  humanURL: https://starlink.readme.io/reference/get_public-v2-mobile-radio-access-network-timestamp
  baseURL: https://starlink.com/api/public/v2/mobile
