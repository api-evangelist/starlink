apis:
- aid: starlink:starlink-public-api-v2
  name: Starlink Public API V2
  description: The Starlink Public API V2 manages accounts, addresses, contacts, service lines,
    user terminals, WiFi routers, data pools, and billing for business and enterprise Starlink
    accounts. The public OpenAPI 3.0.4 description carries 49 paths across 12 tags and is
    downloadable anonymously. Authentication is OIDC client credentials against https://starlink.com/api/auth/connect/token,
    with role-based permissions declared per endpoint.
  humanURL: https://starlink.readme.io/reference
