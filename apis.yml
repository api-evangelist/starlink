    url: openapi/starlink-public-api-v2-openapi.json
- aid: starlink:starlink-aviation-flight-status-api
  name: Starlink Aviation Flight Status API
  description: A single endpoint, POST /public/v2/flights/status, for posting real-time flight
    events from a Starlink-equipped aircraft. It is only callable from an aviation account
    and requires the Aviation flight status management, Edit permission. Related aviation
    guidance covers multi-Starlink WAN failover and GPS-independent location data for aircraft.
  humanURL: https://starlink.readme.io/reference/post_public-v2-flights-status
  baseURL: https://starlink.com/api/public/v2
  tags:
  - Aviation
  - Flights
