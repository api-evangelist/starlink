telemetry_entities:
  source: https://starlink.readme.io/docs/telemetry-api
  device_types:
  - code: u
    name: UserTerminal
    keyed_by: DeviceId (ut prefix)
  - code: r
    name: Router
    keyed_by: DeviceId (Router- prefix)
  - code: i
    name: IpAllocs
    keyed_by: DeviceId (ut prefix), carries AccountNumber, Ipv4, Ipv6Ue, Ipv6Cpe
  note: >-
    Telemetry rows are column-indexed arrays, not objects. The columnNamesByDeviceType map in
    each response is the schema and must be re-parsed per response.
lifecycle_flow:
- Create or reference an Address
- Create a ServiceLine against that Address and a SubscriptionProduct
- Add a UserTerminal to the Account
- Attach the UserTerminal to the ServiceLine
- Optionally assign a RouterConfig and L2VPN circuits
- Consume telemetry and billing for the resulting devices
