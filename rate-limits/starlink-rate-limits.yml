guidance:
- Reduce request rate on HTTP 429 to avoid throttling.
- Starlink recommends periodically syncing API data into your own database rather than
  polling the API for low-latency or expressive queries.
- The telemetry stream is the exception; it is designed to be polled continuously at roughly
  4 requests per minute (a 15000 ms linger per request).
